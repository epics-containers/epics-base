name: Build and publish image to ghcr.io/epics-containers

on:
  push:
  pull_request:

env:
  # image names, -developer or -runtime is appended to these
  NAME: ghcr.io/${{ github.repository_owner }}/epics-base

jobs:
  build:
    # pull requests are a duplicate of a branch push if within the same repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # each platform builds natively on its own runner, then the merge job
        # combines them into a single multi-arch tag. The EPICS arch names
        # (linux-x86_64, linux-aarch64) come from the platform via TARGETARCH
        # in the Dockerfile.
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm

          # NOTE: cross compile targets need a different base image and a
          # separate image name, so they cannot share the multi-arch tag. To
          # build one, pass 'BASE_IMAGE' and 'EPICS_TARGET_ARCH' build-args e.g.
          # # cross compile for RTEMS to VME5500 (power pc beatnik)
          #   EPICS_TARGET_ARCH=RTEMS-beatnik
          #   BASE_IMAGE=ghcr.io/epics-containers/rtems-beatnik-runtime:6.1ec4

    runs-on: ${{ matrix.os }}

    steps:
      - name: Platform name
        id: platform
        run: echo "pair=$(echo ${{ matrix.platform }} | tr / -)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          target: runtime
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}
          tags: ci_test
          load: true

      - name: Test image
        run: |
          docker run --rm ci_test bash -c \
            'echo $EPICS_HOST_ARCH; which softIoc caget pvxget'

      - name: Push developer image by digest
        id: developer
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          target: developer
          outputs: type=image,name=${{ env.NAME }}-developer,push-by-digest=true,name-canonical=true,push=true

      - name: Push runtime image by digest
        id: runtime
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          target: runtime
          outputs: type=image,name=${{ env.NAME }}-runtime,push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          mkdir -p /tmp/digests/developer /tmp/digests/runtime
          touch /tmp/digests/developer/${DEV_DIGEST#sha256:}
          touch /tmp/digests/runtime/${RT_DIGEST#sha256:}
        env:
          DEV_DIGEST: ${{ steps.developer.outputs.digest }}
          RT_DIGEST: ${{ steps.runtime.outputs.digest }}

      - name: Upload digests
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # combine the per-platform images into multi-arch tags
    needs: [build]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        target: [developer, runtime]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ matrix.target }}
        run: |
          image=${{ env.NAME }}-${{ matrix.target }}
          docker buildx imagetools create -t ${image}:${{ github.ref_name }} \
            $(printf "${image}@sha256:%s " *)
          docker buildx imagetools inspect ${image}:${{ github.ref_name }}
